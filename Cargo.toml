[package]
name = "aster-launcher"
version = "0.1.0"
edition = "2021"
description = "A native Rust home for Minecraft Java, profiles, and original cosmetics"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
open = "5"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "Aster-Launcher"
path = "src/main.rs"
